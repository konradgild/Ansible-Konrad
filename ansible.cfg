[defaults]
# Standaard inventory, dan hoef ik niet steeds -i te typen
inventory = ./inventory/hosts.ini
roles_path = ./roles
# Geen melding over de Python-versie op de servers
interpreter_python = auto_silent
retry_files_enabled = False

[privilege_escalation]
# Vraagt bij het starten 1 keer om het sudo-wachtwoord van konrad
become_ask_pass = True
